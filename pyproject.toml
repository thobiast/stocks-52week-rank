[project]
name = "stocks-52week-rank"
description = "A script to rank stocks based on their proximity to the 52-week low."
readme = "README.md"
authors = [
    { name="Thobias Salazar Trevisan" }
]
license = {file = "LICENSE"}
dynamic = ["version", "dependencies"]
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
"Homepage" = "https://github.com/thobiast/stocks-52week-rank"
"Source" = "https://github.com/thobiast/stocks-52week-rank"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "stocks_52week_rank.__version__"}
dependencies = {file = ["requirements.txt"]}

[project.scripts]
stocks-52week-rank = "stocks_52week_rank.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["stocks_52week_rank"]


[tool.isort]
profile = "black"

[tool.pylint]
disable = [
    "too-few-public-methods",
]
